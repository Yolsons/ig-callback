<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorFlow Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 40px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; background: #ddd; border-radius: 50%; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 30px; text-align: center; }
        .upload-area { border: 2px dashed #ccc; padding: 40px; margin-bottom: 20px; border-radius: 8px; color: #666; cursor: pointer; }
        .upload-area:hover { background-color: #f9f9f9; }
        .btn { background: #FE2C55; color: #fff; border: none; padding: 12px 30px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .success-msg { color: green; font-weight: bold; display: none; margin-top: 20px; }
        
        .settings-box { text-align: left; margin: 20px 0; background: #f5f5f5; padding: 15px; border-radius: 5px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input[type="checkbox"] { margin-bottom: 8px; }
        .video-preview-container { margin-bottom: 20px; position: relative; width: 100%; max-width: 300px; height: 0; padding-bottom: 56.25%; background: #000; border-radius: 8px; overflow: hidden; margin-left: auto; margin-right: auto; }
        .video-preview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="header">
        <h2>CreatorFlow Dashboard</h2>
        <div class="user-info">
            <div class="avatar"></div>
            <span>Connected: <strong>@CozyStoryNook</strong></span>
        </div>
    </div>

    <div class="card">
        <h3>New Post</h3>
        
        <!-- VIDEO PREVIEW -->
        <div class="video-preview-container" id="videoPreviewContainer" style="display: none;">
            <video class="video-preview" id="videoPreview" controls></video>
        </div>

        <div class="upload-area" onclick="document.getElementById('file').click()">
            <p id="uploadText">📂 Drag & Drop video here or click to upload</p>
            <input type="file" id="file" style="display: none" accept="video/*" onchange="enableBtn(event)">
        </div>
        
        <!-- PRIVACY AND ADDITIONAL SETTINGS -->
        <div class="settings-box">
            <label>Who can view this video? (Required)</label>
            <select id="privacy">
                <option value="PUBLIC">Everyone (Public)</option>
                <option value="FRIENDS">Friends Only</option>
                <option value="SELF_ONLY" selected>Only Me (Private)</option>
            </select>
            <p style="font-size: 0.8em; color: #666; margin-top: 5px; margin-bottom: 15px;">
                You can change this later in the TikTok app.
            </p>

            <label style="margin-top: 15px;">Additional Settings:</label>
            <div>
                <input type="checkbox" id="disableDuet" checked>
                <label for="disableDuet" style="display: inline;">Disable Duet</label>
            </div>
            <div>
                <input type="checkbox" id="disableStitch" checked>
                <label for="disableStitch" style="display: inline;">Disable Stitch</label>
            </div>
            <div>
                <input type="checkbox" id="disableComment" checked>
                <label for="disableComment" style="display: inline;">Disable Comments</label>
            </div>
        </div>
        
        <button id="pubBtn" class="btn" onclick="fakePublish()" disabled>Publish to TikTok</button>
        
        <p id="msg" class="success-msg">✅ Video successfully sent to TikTok!</p>
    </div>

    <script>
        function enableBtn(event) {
            var file = event.target.files[0];
            if (file) {
                document.getElementById('pubBtn').disabled = false;
                document.getElementById('uploadText').innerText = "✅ Video selected: " + file.name;
                
                // Show video preview
                var videoURL = URL.createObjectURL(file);
                var videoPreview = document.getElementById('videoPreview');
                var videoPreviewContainer = document.getElementById('videoPreviewContainer');
                
                videoPreview.src = videoURL;
                videoPreviewContainer.style.display = 'block';
            } else {
                document.getElementById('pubBtn').disabled = true;
                document.getElementById('uploadText').innerText = "📂 Drag & Drop video here or click to upload";
                document.getElementById('videoPreviewContainer').style.display = 'none';
            }
        }

        function fakePublish() {
            var btn = document.getElementById('pubBtn');
            var privacy = document.getElementById('privacy').value;
            
            btn.innerText = "Uploading to TikTok (" + privacy + ")...";
            btn.disabled = true;
            
            // Имитация загрузки (2 секунды)
            setTimeout(function() {
                btn.innerText = "Published";
                document.getElementById('msg').style.display = 'block';
            }, 2000);
        }
    </script>

</body>
</html>
