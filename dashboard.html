<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreatorFlow Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 40px; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; background: #ddd; border-radius: 50%; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 30px; text-align: center; }
        .upload-area { border: 2px dashed #ccc; padding: 40px; margin-bottom: 20px; border-radius: 8px; color: #666; }
        .btn { background: #FE2C55; color: #fff; border: none; padding: 12px 30px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .success-msg { color: green; font-weight: bold; display: none; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>CreatorFlow Dashboard</h2>
        <div class="user-info">
            <div class="avatar"></div>
            <span>Connected: <strong>@my_tiktok_account</strong></span>
        </div>
    </div>

    <div class="card">
        <h3>New Post</h3>
        <div class="upload-area" onclick="document.getElementById('file').click()">
            <p>Drag & Drop video here or click to upload</p>
            <input type="file" id="file" style="display: none" onchange="enableBtn()">
        </div>
        
        <button id="pubBtn" class="btn" onclick="fakePublish()" disabled>Publish to TikTok</button>
        
        <p id="msg" class="success-msg">✅ Video successfully published to TikTok!</p>
    </div>

    <script>
        function enableBtn() {
            document.getElementById('pubBtn').disabled = false;
            document.querySelector('.upload-area p').innerText = "Video selected: my_cool_video.mp4";
        }

        function fakePublish() {
            var btn = document.getElementById('pubBtn');
            btn.innerText = "Publishing...";
            btn.disabled = true;
            
            // Имитация загрузки (2 секунды)
            setTimeout(function() {
                btn.innerText = "Publish to TikTok";
                document.getElementById('msg').style.display = 'block';
            }, 2000);
        }
    </script>

</body>
</html>
